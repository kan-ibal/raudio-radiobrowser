# ==============================================================================
# rAudio Radio Browser Native Plugin Configuration (raudio.conf)
# Target Path on rAudio: /srv/http/data/system/raudio-radiobrowser.conf
# Also linked to: /srv/http/data/radiobrowser/raudio.conf
# Architecture: Arch Linux ARM / Raspberry Pi / MPD / Redis / nginx
# Compatible with rAudio Addons Manager (addonsprogress.php)
# ==============================================================================

[general]
enabled = 1
version = 1.0.0
user_agent = rAudio-RadioBrowser-Addon/1.0.0 (ArchLinuxARM; RaspberryPi)
log_level = info
autostart = 1

[radiobrowser]
# Primary distributed API mirror with automated DNS & latency failover
default_endpoint = https://de1.api.radio-browser.info
backup_mirrors = https://nl1.api.radio-browser.info,https://at1.api.radio-browser.info,https://all.api.radio-browser.info
api_timeout_sec = 6
cache_ttl = 86400
hide_broken = 1
limit_default = 50

[audio]
# High-fidelity filtering and lossless audio preferences
min_bitrate = 192
prefer_lossless = 1
default_codec = FLAC
buffer_time = 4000
stream_buffer_kb = 8192
icy_metadata = 1
replaygain = auto

[webradio]
# rAudio native WebRadio catalog integration
# Format: Each station is a Directory containing a 'data' file with the stream hyperlink
webradio_dir = /srv/http/data/webradio
webradio_img_dir = /srv/http/data/webradio/img
webradio_format = directory_data
data_file_name = data
auto_download_favicons = 1
file_encoding = UTF-8

[mpd]
# Music Player Daemon connection
host = 127.0.0.1
port = 6600
timeout = 5
auto_play_on_add = 1

[redis]
# Redis pub/sub real-time WebUI state synchronization
host = 127.0.0.1
port = 6379
notify_channel = notify
webradio_channel = webradio
